<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>John Dungeons - AAA Stylized TPS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: system-ui, -apple-system, sans-serif;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #151828 0%, #050508 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-out;
        }
        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loader-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 0.2rem;
            margin-bottom: 2rem;
            color: #d4af37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .progress-bar-container {
            width: 320px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8860b, #ffd700);
            transition: width 0.2s ease;
        }
        .progress-text {
            margin-top: 1rem;
            font-size: 0.9rem;
            letter-spacing: 0.1rem;
            color: rgba(255, 255, 255, 0.7);
        }
        #hud-layer {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }
        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
        }
        .crosshair::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 2px; height: 2px;
            background: #ffd700;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }
        .hud-top, .hud-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .hud-panel {
            background: rgba(10, 10, 15, 0.7);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.75rem 1.25rem;
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }
        .health-bar-container {
            width: 200px;
            height: 14px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        #health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #8b0000, #ff4500);
            transition: width 0.3s;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-DWoU0Ybl.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-title">JOHN DUNGEONS</div>
        <div class="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">Initializing Engine... 0%</div>
    </div>

    <div id="canvas-container"></div>

    <div id="hud-layer" style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:10;pointer-events:none;font-family:system-ui,sans-serif;color:#fff;"></div>

</body>
</html>
